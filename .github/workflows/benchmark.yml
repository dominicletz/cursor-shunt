name: Live SDK benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of baseline/shunt pairs to run"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check benchmark secret
        id: secret-check
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip because CURSOR_API_KEY is not configured
        if: ${{ steps.secret-check.outputs.configured != 'true' }}
        run: echo "::notice::CURSOR_API_KEY repository secret is not configured; live benchmark skipped."

      - name: Check out repository
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        run: npm ci

      - name: Generate fixture
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        run: npm run bench:fixture

      - name: Run paid benchmark
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BENCH_PARENT_MODEL: gpt-5.6
          SHUNT_MIN_LINES: "350"
        run: npm run bench:ab -- --runs "${{ inputs.runs }}" --output bench/results/live-summary.json

      - name: Upload aggregate benchmark summary
        if: ${{ steps.secret-check.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-benchmark-summary
          path: bench/results/live-summary.json
          if-no-files-found: error
